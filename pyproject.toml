[project]
name = "offset"
version = "0.5.1"
description = "Terminal coding agent. Speculative branching. Neubrutalist by construction."
requires-python = ">=3.11"
dependencies = ["prompt_toolkit>=3.0.50"]

[project.scripts]
offset = "offset.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["offset"]
