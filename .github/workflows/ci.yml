name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest anyio typeguard

    - name: Run Test Suite
      run: |
        PYTHONPATH=. pytest tests/

  client:
    name: typescript client (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      # Both ends of the supported range.  `node --test` only learned to expand
      # glob patterns itself in 22, so a script that works on the newest Node
      # can still fail on the oldest one this package claims to support - which
      # is exactly how it failed the first time.
      matrix:
        node-version: ["20", "24"]
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    # `npm ci` because the client commits its lockfile.  The extension below
    # does not: its only dependency is a `file:` link to this package, which a
    # lockfile pins to a resolved path that is not portable between checkouts.
    - name: Build and test the client
      working-directory: clients/typescript
      run: |
        npm ci --no-audit --no-fund
        npm test

    # The extension is the first consumer of the client, so a protocol type
    # that drifts from `bridge.py` breaks here rather than in somebody's editor.
    - name: Typecheck the VS Code extension against it
      working-directory: editors/vscode
      run: |
        npm install --no-audit --no-fund
        npx tsc --noEmit -p .
