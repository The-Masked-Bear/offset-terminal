name: 🐛 Bug Report
description: Create a report to help us improve Offset
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce?
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `offset`
        2. Execute `/spec 3 ...`
        3. See error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: System / OS / Python Version
      placeholder: Linux (Raspberry Pi arm64) / macOS / Windows - Python 3.12
    validations:
      required: true
